# staging. Replace app name before first use. No secrets here: set them with `fly secrets set`.
app = "sitepulse-ai-staging"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "sitepulse_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"   # single volume-backed machine: no blue/green

